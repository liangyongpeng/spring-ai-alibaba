server:
  port: 8080
  # 大模型对话中文乱码处理
  servlet:
    encoding:
      enabled: true
      force: true
      charset: UTF-8

spring:
  application:
    name: ssa-hello-world
  ai:
    dashscope:
      # 密钥从环境变量读取，不要硬编码提交到仓库
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      chat:
        options:
          model: qwen-plus


